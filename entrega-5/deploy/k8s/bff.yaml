apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: hda
  labels:
    app: bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bff
  template:
    metadata:
      labels:
        app: bff
    spec:
      containers:
        - name: bff
          image: __ARTIFACT_REGISTRY__/bff:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: PARTNER_INTEGRATION_URL
              value: http://partner-integration
            - name: PARTNER_RULES_URL
              value: http://partner-rules
            - name: WORK_ORCHESTRATION_URL
              value: http://work-orchestration
            - name: PROVIDER_MATCHING_URL
              value: http://provider-matching
            - name: HTTP_TIMEOUT_SECONDS
              value: "5"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  namespace: hda
spec:
  type: LoadBalancer
  selector:
    app: bff
  ports:
    - name: http
      port: 80
      targetPort: 8000
