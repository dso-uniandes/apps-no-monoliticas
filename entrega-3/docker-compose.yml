services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hda
      POSTGRES_PASSWORD: hda
      POSTGRES_DB: hda
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hda"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672", "15672:15672"]

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://hda:hda@postgres:5432/hda
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports: ["8000:8000"]
    depends_on: [postgres, rabbitmq]
