apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-integration
  namespace: hda
  labels:
    app: partner-integration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: partner-integration
  template:
    metadata:
      labels:
        app: partner-integration
    spec:
      containers:
        - name: partner-integration
          image: __ARTIFACT_REGISTRY__/partner-integration:__IMAGE_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MESSAGING_ENABLED
              value: "false"
            - name: PERSISTENCE_BACKEND
              value: sqlite
            - name: DATABASE_URL
              value: sqlite:////data/partner_integration.db
            - name: AUTO_CREATE_SCHEMA
              value: "true"
          volumeMounts:
            - name: partner-integration-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: partner-integration-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: partner-integration
  namespace: hda
spec:
  type: ClusterIP
  selector:
    app: partner-integration
  ports:
    - name: http
      port: 80
      targetPort: 8000
